name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Icon SVGs are a build artifact downloaded from game-icons.net; the
      # icon manifest and generated CSS are then refreshed so the deployed
      # app always matches the downloaded set.
      - name: Restore icon assets
        id: icon-cache
        uses: actions/cache@v4
        with:
          path: |
            public/icons
            resources/generated
          key: game-icons-${{ hashFiles('resources/tools/update-icons.cjs') }}-${{ github.run_id }}
          restore-keys: |
            game-icons-${{ hashFiles('resources/tools/update-icons.cjs') }}-

      - name: Download icon assets (cache miss)
        if: hashFiles('resources/generated/icons.css') == ''
        run: pnpm build:icons

      - name: Regenerate icon manifest
        run: pnpm gen:icons

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
