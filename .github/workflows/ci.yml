name: CI

on:
  push:
    branches:
      - master
      - react-migration
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (incl. golden-master parity)
        run: pnpm test

      # The icon SVG set is a build artifact downloaded from game-icons.net
      # (gitignored). Cache it across runs; refresh whenever the cache is
      # evicted or the updater script changes.
      - name: Restore icon assets
        id: icon-cache
        uses: actions/cache@v4
        with:
          path: |
            public/icons
            resources/generated
          key: game-icons-${{ hashFiles('resources/tools/update-icons.cjs') }}-${{ github.run_id }}
          restore-keys: |
            game-icons-${{ hashFiles('resources/tools/update-icons.cjs') }}-

      - name: Download icon assets (cache miss)
        if: hashFiles('resources/generated/icons.css') == ''
        run: pnpm build:icons

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Print parity / visual tests
        run: pnpm test:visual

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
